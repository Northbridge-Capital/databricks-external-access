name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright

  # The package must work on every OS and on both ends of the supported Python range.
  # The integration test skips itself here because CI has no Databricks sign-in.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --locked
      - run: uv run pytest --cov --cov-fail-under=85

  # The lower bounds in pyproject.toml must actually work, not just the locked versions.
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true
          python-version: "3.11"

      - run: uv run --isolated --resolution lowest-direct --group dev pytest

  # The built package must be valid, render on PyPI, and import from a clean environment.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml

      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import databricks_external_access"

  # The one check branch protection requires (see the infrastructure repo). It has a stable name
  # so changing the jobs or the test matrix above never needs an infrastructure change.
  # `always()` makes it report even when a job failed or was cancelled, and it fails unless
  # every job succeeded.
  ci-required:
    if: always()
    needs: [lint, test, test-lowest, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs succeeded"
