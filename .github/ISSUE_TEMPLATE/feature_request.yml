name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first; a solution can follow.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
