version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # duckdb and databricks-sdk are the two runtime dependencies; a new release of either can
  # break reading Lakeflow tables, so they get their own PRs and are never grouped.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
