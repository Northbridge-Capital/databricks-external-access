[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "databricks-external-access"
version = "0.1.3"
description = "Browse Databricks Unity Catalog and fetch tables to local Parquet files, no Databricks compute needed"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Northbridge Capital" }]
keywords = ["databricks", "unity-catalog", "delta-lake", "duckdb", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "databricks-sdk>=0.169",
  "duckdb>=2.0",
]

[project.urls]
Homepage = "https://github.com/Northbridge-Capital/databricks-external-access"
Documentation = "https://northbridge-capital.github.io/databricks-external-access/"
Source = "https://github.com/Northbridge-Capital/databricks-external-access"
Issues = "https://github.com/Northbridge-Capital/databricks-external-access/issues"
Changelog = "https://github.com/Northbridge-Capital/databricks-external-access/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "basedpyright>=1.18",
  "deltalake>=1.6",
  "pyarrow>=22",
]
docs = [
    "myst-parser>=5.2.0",
    "numpydoc>=1.11.0",
    "pydata-sphinx-theme>=0.24.0",
    "sphinx>=9.0.4",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinxext-opengraph>=0.13.0",
]
# Only for examples/tutorial.ipynb: `uv run --group notebook jupyter lab`.
notebook = [
  "jupyterlab>=4",
  "pandas>=2.2",
  "pyarrow>=22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_external_access"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "SIM", "PT", "RUF", "C4", "PIE", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S105", "S608"]
"examples/*.ipynb" = ["D", "S608"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/databricks_external_access"]
branch = true

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false
